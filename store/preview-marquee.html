<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
      body { position: relative; background: #f4efe6; color: #243528; }
      .copy { position: absolute; left: 92px; top: 150px; }
      h1 {
        margin: 0;
        font: 600 64px/0.98 Palatino, "Palatino Linotype", Georgia, serif;
        letter-spacing: -0.03em;
      }
      h1::after {
        content: "";
        display: block;
        width: 148px;
        height: 3px;
        margin: 22px 0 18px;
        background: #243528;
      }
      p { margin: 0; font: 26px/1 "Avenir Next", "Segoe UI", sans-serif; color: #4d5646; }
      .compass { position: absolute; left: 1048px; top: 196px; }
      .pin { position: absolute; left: 1236px; top: 210px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Know the country.<br />Not the pinpoint.</h1>
      <p>Country, compass, and city for WorldGuessr.</p>
    </div>
    <svg class="compass" width="156" height="156" viewBox="0 0 92 92" aria-hidden="true">
      <circle cx="46" cy="46" r="34" fill="none" stroke="#243528" stroke-width="2.2" />
      <circle cx="46" cy="8" r="2.6" fill="#243528" />
      <circle cx="46" cy="84" r="2.6" fill="#243528" />
      <circle cx="8" cy="46" r="2.6" fill="#243528" />
      <circle cx="84" cy="46" r="2.6" fill="#243528" />
      <path fill="#243528" d="M46 16 52 40 76 46 52 52 46 76 40 52 16 46 40 40Z" />
    </svg>
    <svg class="pin" width="100" height="132" viewBox="0 0 64 84" aria-hidden="true">
      <path fill="#c4a265" d="M32 2c16 0 28 12 28 28 0 22-28 52-28 52S4 52 4 30C4 14 16 2 32 2Z" />
      <circle cx="32" cy="30" r="10" fill="#f4efe6" />
    </svg>
  </body>
</html>
