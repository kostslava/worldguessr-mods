<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 64px;
        background: #f4efe6 url("bg-map.jpg") center / cover no-repeat;
        color: #243528;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
      .slot { width: 500px; height: 730px; flex: none; position: relative; }
      .copy { flex: 1; min-width: 0; }
      .copy h1 {
        margin: 0;
        font: 600 54px/1.02 Palatino, "Palatino Linotype", Georgia, serif;
        letter-spacing: -0.03em;
      }
      .copy p {
        margin: 22px 0 0;
        max-width: 420px;
        font-size: 22px;
        line-height: 1.35;
        color: #4d5646;
      }
      .pop {
        position: absolute;
        top: 0;
        left: 0;
        width: 280px;
        zoom: 1.72;
        color: #243528;
        background:
          radial-gradient(120% 80% at 100% 0%, rgba(196, 162, 101, 0.18), transparent 42%),
          #f4efe6;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(36, 53, 40, 0.18);
        font: 13px/1.4 "Avenir Next", "Segoe UI", sans-serif;
      }
      header { display: flex; gap: 10px; align-items: center; padding: 14px 16px 12px; }
      .mark { width: 36px; height: 36px; flex: none; }
      h2 { margin: 0; font: 600 18px/1.1 Palatino, "Palatino Linotype", Georgia, serif; letter-spacing: -0.02em; }
      header p { margin: 2px 0 0; color: #6d7464; font-size: 11px; }
      section {
        margin: 0 12px 12px;
        padding: 4px 10px;
        background: rgba(255, 252, 247, 0.72);
        border: 1px solid #e3d9c8;
        border-radius: 14px;
      }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; min-height: 40px; border-top: 1px solid #e3d9c8;
      }
      .row:first-child { border-top: 0; }
      .row span { font-weight: 600; }
      .switch { position: relative; width: 36px; height: 22px; flex: none; }
      .switch i {
        display: block; width: 36px; height: 22px; border-radius: 999px; background: #243528;
      }
      .switch i::after {
        content: ""; position: absolute; top: 3px; left: 17px; width: 16px; height: 16px;
        border-radius: 50%; background: #fffdf8; box-shadow: 0 1px 2px rgba(36, 53, 40, 0.25);
      }
      .range { padding: 8px 2px 10px; }
      .range label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
      output { color: #6d7464; font-variant-numeric: tabular-nums; font-weight: 500; }
      input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: #c4a265; }
      footer { margin: 0; padding: 0 16px 14px; color: #6d7464; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="slot"><div class="pop">
      <header>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="#243528" d="M32 4 38 26 60 32 38 38 32 60 26 38 4 32 26 26Z" />
          <circle cx="32" cy="32" r="8" fill="#c4a265" />
          <path fill="#243528" d="M32 27.5c2.2 0 3.4 1.5 3.4 3.2 0 2.2-3.4 6.3-3.4 6.3s-3.4-4.1-3.4-6.3c0-1.7 1.2-3.2 3.4-3.2Z" />
        </svg>
        <div>
          <h2>Street View Hint</h2>
          <p>Version 1.1.0</p>
        </div>
      </header>
      <section>
        <div class="row"><span>Hints</span><span class="switch"><i></i></span></div>
        <div class="row"><span>Drop pin on the map</span><span class="switch"><i></i></span></div>
        <div class="row"><span>Zoom to the area</span><span class="switch"><i></i></span></div>
      </section>
      <section>
        <div class="range">
          <label>Closest <output>10 km</output></label>
          <input type="range" min="0" max="200" value="10" />
        </div>
        <div class="range">
          <label>Farthest <output>20 km</output></label>
          <input type="range" min="0" max="200" value="20" />
        </div>
      </section>
      <footer>The pin lands between those distances from the real spot. 0 km is exact.</footer>
    </div></div>
    <div class="copy">
      <h1>Know the country.<br />Not the pinpoint.</h1>
      <p>Country, compass direction, and city. The pin lands between the distances you set.</p>
    </div>
  </body>
</html>
