<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f4efe6;
        color: #243528;
      }
      .marks { display: flex; align-items: center; gap: 28px; }
      h1 {
        margin: 6px 0 0;
        font: 600 34px/1 Palatino, "Palatino Linotype", Georgia, serif;
        letter-spacing: -0.03em;
      }
      p { margin: 0; font: 16px/1 "Avenir Next", "Segoe UI", sans-serif; color: #4d5646; }
    </style>
  </head>
  <body>
    <div class="marks">
      <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="34" fill="none" stroke="#243528" stroke-width="2.5" />
        <circle cx="46" cy="8" r="3" fill="#243528" />
        <circle cx="46" cy="84" r="3" fill="#243528" />
        <circle cx="8" cy="46" r="3" fill="#243528" />
        <circle cx="84" cy="46" r="3" fill="#243528" />
        <path fill="#243528" d="M46 16 52 40 76 46 52 52 46 76 40 52 16 46 40 40Z" />
      </svg>
      <svg width="64" height="84" viewBox="0 0 64 84" aria-hidden="true">
        <path fill="#c4a265" d="M32 2c16 0 28 12 28 28 0 22-28 52-28 52S4 52 4 30C4 14 16 2 32 2Z" />
        <circle cx="32" cy="30" r="10" fill="#f4efe6" />
      </svg>
    </div>
    <h1>Street View Hint</h1>
    <p>Country, area, city</p>
  </body>
</html>
